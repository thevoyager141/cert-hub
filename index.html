<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Cert Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 고정 내비(Scheduler·Guidance·Challenger) + 화면별 본문. Scheduler는 넓은 간트(가로 스크롤), Guidance·Challenger는 1080px 읽기 폭. Dark-first, ccaf-academy와 같은 테라코타 포인트, 시험별 고유색. */
:root{
  --bg:#121116; --panel:#1b1a20; --panel-2:#23222a; --panel-3:#2b2a33; --line:#302e38;
  --fg:#ecebef; --muted:#a3a0ac; --faint:#76737f;
  --accent:#e0805f; --accent-soft:rgba(224,128,95,.15); --accent-line:rgba(224,128,95,.55); --accent-ink:#f0a184;
  --known:#46444f; --partial:#a8876a; --new:#e0805f;
  --on-known:#ecebef; --on-partial:#1a1714; --on-new:#1a1210;
  --c-ao:#5fbfa9; --c-dv:#86a2f2; --c-arp:#e3ad62; --c-arf:#9b98a6;
  --ok:#6cc08b; --bad:#ec7a6f;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Chakra Petch","IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f1; --panel:#ffffff; --panel-2:#efede8; --panel-3:#e6e3dd; --line:#dfdcd5;
    --fg:#1c1a1f; --muted:#5d5a64; --faint:#86838c;
    --accent:#bf5835; --accent-soft:rgba(191,88,53,.10); --accent-line:rgba(191,88,53,.5); --accent-ink:#a2442a;
    --known:#d5d2cb; --partial:#d8b89b; --new:#bf5835;
    --on-known:#1c1a1f; --on-partial:#1a1714; --on-new:#ffffff;
    --c-ao:#24806e; --c-dv:#4565c9; --c-arp:#a8691a; --c-arf:#76737f;
    --ok:#2f8a55; --bad:#c2453a;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f4f1; --panel:#ffffff; --panel-2:#efede8; --panel-3:#e6e3dd; --line:#dfdcd5;
  --fg:#1c1a1f; --muted:#5d5a64; --faint:#86838c;
  --accent:#bf5835; --accent-soft:rgba(191,88,53,.10); --accent-line:rgba(191,88,53,.5); --accent-ink:#a2442a;
  --known:#d5d2cb; --partial:#d8b89b; --new:#bf5835;
  --on-known:#1c1a1f; --on-partial:#1a1714; --on-new:#ffffff;
  --c-ao:#24806e; --c-dv:#4565c9; --c-arp:#a8691a; --c-arf:#76737f;
  --ok:#2f8a55; --bad:#c2453a;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px;display:flex;align-items:center;gap:10px 24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-family:var(--disp);font-size:17px;letter-spacing:.02em}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--accent-ink);letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;max-width:100%}
.nav button{border:0;background:transparent;border-radius:7px;padding:6px 14px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;white-space:nowrap}
.nav button b{font-family:var(--disp);font-size:14px;font-weight:600}
.nav button span{font-size:11px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-new)}
.nav button[aria-current="page"] span{color:var(--on-new);opacity:.85}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
.wrap.narrow{max-width:1080px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
h1{font-size:clamp(24px,3.6vw,32px);line-height:1.25;margin:4px 0 6px;font-weight:700;text-wrap:balance}
h2{font-size:19px;line-height:1.35;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:15.5px;margin:0;font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:68ch;font-size:14.5px}
.howto{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:90ch}
.howto b{color:var(--fg);font-weight:600;margin-right:4px}
.sec{display:flex;flex-direction:column;gap:12px}
.banner{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-new)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ===== Scheduler ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.toolbar .status{font-size:12.5px;color:var(--muted);margin-left:auto;font-family:var(--mono)}
.dday{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dd{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc,var(--accent));border-radius:0 0 10px 10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.dd > div{min-width:0;flex:1}
.dd b{font-family:var(--disp);font-size:14px}
.dd .ddt{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.dd .dn{flex:none;font-family:var(--disp);font-size:22px;font-weight:700;color:var(--cc,var(--accent))}
.g-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);position:relative}
.gantt{position:relative;--lw:132px;user-select:none;-webkit-user-select:none}
.g-axis{position:relative;height:46px;margin-left:var(--lw);border-bottom:1px solid var(--line)}
.g-axis .m{position:absolute;top:4px;font-family:var(--mono);font-size:12px;color:var(--muted);padding-left:6px;border-left:1px solid var(--line);height:18px;line-height:18px;white-space:nowrap}
.g-axis .wk{position:absolute;top:24px;font-family:var(--mono);font-size:10px;color:var(--faint);transform:translateX(-50%)}
.g-axis .mk{position:absolute;bottom:3px;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--accent-ink);white-space:nowrap;background:var(--panel);padding:0 4px;z-index:1}
.g-body{position:relative}
.g-grid{position:absolute;left:var(--lw);top:0;bottom:0;right:0;pointer-events:none}
.g-grid .gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.g-grid .wl{position:absolute;top:0;bottom:0;border-left:1px dotted var(--line);opacity:.7}
.g-grid .ml{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--accent-line)}
.g-grid .td{position:absolute;top:0;bottom:0;border-left:2px solid var(--faint)}
.g-row{display:flex;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-label{width:var(--lw);flex:none;padding:8px 10px 8px 12px;display:flex;flex-direction:column;justify-content:center;position:sticky;left:0;background:var(--panel);z-index:3;border-right:1px solid var(--line)}
.g-label b{font-family:var(--disp);font-size:13.5px;font-weight:600;color:var(--cc,var(--fg))}
.g-label span{font-size:11.5px;color:var(--muted);line-height:1.35}
.g-track{position:relative;flex:none}
.bar{position:absolute;height:26px;border-radius:6px;font-size:11.5px;line-height:24px;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:grab;touch-action:none;border:1px solid transparent}
.bar:active{cursor:grabbing}
.bar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .h.l{left:0} .bar .h.r{right:0}
.bar.lec{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.bar.prac{background:var(--accent);border-color:var(--accent);color:var(--on-new)}
.bar.struct{background:var(--panel);border:2px solid var(--accent);color:var(--fg);line-height:22px}
.bar.ext{background:var(--panel-3);border-color:var(--line);color:var(--muted)}
.bar.site{border:1px dashed var(--faint);color:var(--muted);background:transparent}
.bl{position:absolute;height:26px;line-height:26px;font-size:11.5px;font-weight:500;color:var(--fg);white-space:nowrap;pointer-events:none}
.bl.ext,.bl.site{color:var(--muted)}
.bar.sel,.ms.sel{box-shadow:0 0 0 2px var(--fg)}
.bar.drag{opacity:.85;z-index:5}
.ms{position:absolute;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);cursor:grab;touch-action:none}
.ms.exam{background:var(--fg)}
.ms.retake{border:2px solid var(--fg);background:var(--panel)}
.ms-l{position:absolute;font-size:11px;font-weight:600;white-space:nowrap;font-family:var(--mono);pointer-events:none}
.ms-l.retake{color:var(--muted);font-weight:500}
.tip{position:fixed;z-index:40;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.legend i.lec{background:var(--accent-soft);border:1px solid var(--accent-line)}
.legend i.prac{background:var(--accent)}
.legend i.struct{background:var(--panel);border:2px solid var(--accent)}
.legend i.ext{background:var(--panel-3);border:1px solid var(--line)}
.legend i.site{border:1px dashed var(--faint)}
.legend i.d{width:10px;height:10px;transform:rotate(45deg);border-radius:0;margin-right:8px}
.legend i.d.exam{background:var(--fg)} .legend i.d.retake{border:2px solid var(--fg)}
.legend i.ml{width:0;height:12px;border-left:1.5px dashed var(--accent);border-radius:0}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:14px}
.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
.lt{min-width:760px;font-size:13.5px}
.lt th{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.lt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.lt tr:last-child td{border-bottom:0}
.lt tbody tr{cursor:pointer}
.lt tbody tr:hover td{background:var(--panel-2)}
.lt td.p{font-family:var(--mono);white-space:nowrap;font-size:12.5px;color:var(--muted)}
.lt td.n{font-weight:600;min-width:180px}
.lt td.d{color:var(--muted)}
.tchip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;white-space:nowrap;font-weight:500;border:1px solid var(--line);background:var(--panel-2)}
.tchip.lec{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.tchip.prac{background:var(--accent);border-color:var(--accent);color:var(--on-new)}
.tchip.struct{border:2px solid var(--accent)}
.tchip.site{border-style:dashed}
.tchip.exam{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rowname{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--cc,var(--fg));white-space:nowrap}
/* schedule list (grouped) */
.lhd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px}
.lsw{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.lsw button{border:0;background:transparent;border-radius:6px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.lsw button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.glist{columns:2;column-gap:12px}
.grp{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc,var(--line));border-radius:0 0 10px 10px;min-width:0;break-inside:avoid;margin-bottom:12px;display:inline-block;width:100%}
.grp-hd{display:flex;align-items:baseline;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.grp-hd b{font-family:var(--disp);font-size:14.5px;font-weight:600;color:var(--cc,var(--fg))}
.grp-hd span{font-size:12px;color:var(--muted)}
.grp-hd em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.grp-hd i{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:0;margin-right:2px}
.grp-hd i.d{width:9px;height:9px;transform:rotate(45deg);border-radius:0}
.grp ul{list-style:none;margin:0;padding:0}
.gi{display:grid;grid-template-columns:92px minmax(0,1fr);gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.grp li:last-child .gi{border-bottom:0}
.gi:hover{background:var(--panel-2)}
.gi .gd{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5;white-space:nowrap}
.gi .gd em{display:block;font-style:normal;font-size:11px;color:var(--faint)}
.gi .gt{min-width:0;display:flex;flex-direction:column;gap:3px}
.gi .gt b{font-size:13.5px;font-weight:600;line-height:1.45}
.gi .gt p{font-size:12.5px;color:var(--muted);line-height:1.5}
.gi .gt .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px}
/* glossary + footer */
.gloss{border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px}
.gloss summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:13px}
.gloss dl{margin:0;padding:2px 14px 12px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.res>div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.res b{color:var(--fg);font-size:13.5px}
.res em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.foot{border-top:1px solid var(--line)}
.foot-in{max-width:1240px;margin:0 auto;padding:22px max(16px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font-size:12px;color:var(--faint)}
.foot-in a{color:var(--muted)}

/* drawer */
.drawer{position:fixed;z-index:30;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-18px 0 40px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.03em}
.fld input,.fld select,.fld textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.fld textarea{min-height:120px;resize:vertical;line-height:1.55}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-ft{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.dr-ft .sp{margin-left:auto}
.err{font-size:12.5px;color:var(--bad)}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35)}

/* ===== Guidance ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 14px;font-size:13.5px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button .c{font-family:var(--disp);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.tile .k{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em}
.tile .v{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.3}
.tile .v.s{font-family:var(--font);font-size:14px;font-weight:600;line-height:1.45;padding-top:4px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:0 0 10px 10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .hd b{font-family:var(--disp);font-size:16px;color:var(--cc)}
.card .hd span{font-size:11.5px;color:var(--muted)}
.card dl{margin:0;display:flex;flex-direction:column;gap:8px}
.card dt{font-size:11px;color:var(--faint);font-family:var(--mono);letter-spacing:.03em}
.card dd{margin:2px 0 0;font-size:13.5px}
.card dd.topic{font-size:15px;font-weight:600;line-height:1.45}
.card ul{margin:2px 0 0;padding-left:16px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.matrix{min-width:620px;font-size:13.5px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:middle}
.matrix thead th{font-family:var(--disp);font-size:13px;font-weight:600;text-align:center}
.matrix thead th:first-child{text-align:left;font-family:var(--mono);color:var(--faint);font-weight:500;font-size:11.5px}
.matrix tr:last-child td{border-bottom:0}
.matrix td.ly b{display:block;font-size:14px}
.matrix td.ly span{font-size:12.5px;color:var(--muted)}
.matrix td.dot{text-align:center;width:13%;position:relative}
.dt{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}
.dt.full{background:var(--accent)}
.dt.half{border:1.5px solid var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dt.none{width:10px;height:2px;border-radius:0;background:var(--faint)}
.qbars{display:flex;flex-direction:column;gap:12px}
.qb{display:grid;grid-template-columns:96px minmax(0,1fr) 150px;gap:12px;align-items:center}
.qb b{font-family:var(--disp);font-size:14px;color:var(--cc)}
.qb .stk{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px}
.seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.seg.known{background:var(--known);color:var(--on-known)} .seg.partial{background:var(--partial);color:var(--on-partial)} .seg.new{background:var(--new);color:var(--on-new)}
.qb .s{font-size:12.5px;color:var(--muted)}
.lvl{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.lvl i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* flow map */
.map{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.map-hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline;margin-bottom:12px}
.map-hd .ask{font-size:12.5px;color:var(--muted)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;counter-reset:f}
.flow li{position:relative;min-width:0;counter-increment:f;display:flex}
.flow li > button,.flow li > div{flex:1;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.flow li > button:hover{border-color:var(--accent-line)}
.flow li > button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.flow li .num::before{content:counter(f);font-family:var(--mono);font-size:11px;color:var(--faint)}
.flow li:not(:last-child)::after{content:"→";position:absolute;right:-17px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700}
.flow .sn{font-weight:600;font-size:14px;line-height:1.35}
.flow .sd{font-size:12.5px;color:var(--muted);line-height:1.45}
.dms{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px}
.dm{font-size:11.5px;padding:1px 7px;border-radius:4px;font-weight:600;line-height:1.5}
.dm.stg{border:1px solid var(--line);background:var(--panel-3);color:var(--fg);font-weight:500}
.dm.tag{border:1px solid var(--accent-line);color:var(--accent-ink);background:transparent;font-size:10.5px}
.dm.known{background:var(--known);color:var(--on-known)} .dm.partial{background:var(--partial);color:var(--on-partial)} .dm.new{background:var(--new);color:var(--on-new)}
.map .xtra{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.map .xtra > button,.map .xtra > div{text-align:left;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-radius:8px;border:1px solid transparent;background:transparent}
.map .xtra .loop{border:1px dashed var(--accent-line)}
.map .xtra .across{background:var(--accent-soft)}
.map .xtra > button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.map .xtra b{font-size:12px;font-family:var(--mono);color:var(--accent-ink)}

/* domain rows */
.doms{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.dom{border-bottom:1px solid var(--line)}
.dom:last-child{border-bottom:0}
.dom.dim > button{opacity:.38}
.dom > button{width:100%;border:0;background:transparent;text-align:left;padding:11px 14px;display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 92px 20px;gap:12px;align-items:center}
.dom > button:hover{background:var(--panel-2)}
.dom .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.dom .nm i{width:10px;height:10px;border-radius:2px;flex:none}
.sq{display:flex;flex-wrap:wrap;gap:3px}
.sq i{width:11px;height:11px;border-radius:2px;display:block}
.sq i.known{background:var(--known)} .sq i.partial{background:var(--partial)} .sq i.new{background:var(--new)}
.dom .cnt{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.dom .cnt b{color:var(--fg);font-size:14px}
.dom .chev{color:var(--faint);transition:transform .15s}
.dom.open .chev{transform:rotate(90deg)}
.dom-detail{padding:4px 14px 16px 36px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;font-size:13.5px}
.dom-detail h4{margin:0 0 6px;font-size:11.5px;font-family:var(--mono);color:var(--faint);font-weight:500;letter-spacing:.04em}
.dom-detail ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:3px}
.dom-detail .sub{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:4px}
.modlink{display:flex;flex-direction:column;gap:6px}
.modlink a{font-weight:500}

/* ===== Challenger ===== */
.stage{border-radius:14px;padding:28px 22px 26px;background:radial-gradient(120% 90% at 50% 0%,var(--panel-3) 0%,var(--panel) 55%,var(--bg) 100%);border:1px solid var(--line)}
.stage-hd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:22px}
.stage-hd h1{font-family:var(--disp);letter-spacing:.04em;margin:0}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pick{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--fg);text-decoration:none;min-width:0;transition:transform .18s ease, box-shadow .18s ease, border-color .18s}
.pick:hover,.pick:focus-visible{transform:translateY(-4px);border-color:var(--cc);box-shadow:0 0 0 1px var(--cc),0 18px 40px -18px var(--cc)}
.pick .emb{width:96px;height:96px;color:var(--cc);filter:drop-shadow(0 6px 18px color-mix(in srgb, var(--cc) 35%, transparent))}
.pick .code{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:.05em;color:var(--cc)}
.pick .nm{font-size:13px;color:var(--muted);margin-top:-6px}
.pick .role{font-size:12.5px;line-height:1.45;min-height:36px}
.pick .pill{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid var(--cc);color:var(--cc)}
.pick .pill.done{background:var(--cc);color:var(--bg)}
.stats{width:100%;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:10px}
.st{display:grid;grid-template-columns:64px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:11.5px;text-align:left}
.st span{color:var(--muted)}
.st .b{display:block;height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.st .b i{display:block;height:100%;background:var(--cc)}
.st em{font-style:normal;font-family:var(--mono);text-align:right;font-size:11.5px}
.pick .go{margin-top:2px;font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--cc)}
.course-hd{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.course-hd .emb{width:72px;height:72px;color:var(--cc);flex:none}
.course-hd .ti{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.course-hd .ti b{font-family:var(--disp);font-size:26px;color:var(--cc);letter-spacing:.04em;line-height:1.1}
.course-hd .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:4px;flex:1 1 200px;max-width:320px}
.prog .b{height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--cc)}
.prog span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.steps-h{display:flex;align-items:center;gap:10px}
.steps-h .n{width:26px;height:26px;border-radius:50%;background:var(--cc);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;flex:none}
.order{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.order>div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.order b{color:var(--fg);font-size:13px}
.order .on{font-family:var(--mono);font-size:11px;color:var(--cc,var(--fg));}
.order em{font-style:normal;color:var(--faint);font-size:11.5px}
.order a{overflow-wrap:anywhere}
h2.sm{font-size:15px;margin-bottom:8px}
.routine{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.routine div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.routine b{display:block;color:var(--fg);font-size:13px}
.mods{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.mod{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.mod:last-child{border-bottom:0}
.mod.done .mt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.mod input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--cc)}
.mod .mt{font-weight:600;font-size:14px}
.mod .mm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.mod details{margin-top:6px;font-size:13px;color:var(--muted)}
.mod details summary{cursor:pointer;font-size:12.5px;color:var(--fg)}
.mod details ul{margin:6px 0 0;padding-left:17px;display:flex;flex-direction:column;gap:2px}
.mod ol.les{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.mod ol.les li{padding-left:2px}
.mod ol.les li span{color:var(--fg)}
.mod ol.les li .dm{margin-left:6px}
.mod ol.les li em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:8px}
.mod .min{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.mod .note{font-size:12.5px;color:var(--accent-ink);margin-top:4px}
.qs{display:flex;flex-direction:column;gap:14px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q .qn{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.q .stem{font-size:14.5px;line-height:1.6}
.q .ph{font-size:12px;font-family:var(--mono);color:var(--accent-ink);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:4px 12px;font-size:12.5px}
.chips button:hover:not([disabled]){border-color:var(--accent-line)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 12px;font-size:13.5px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.opts button:hover:not([disabled]){border-color:var(--accent-line)}
.opts button b{font-family:var(--mono)}
.chips button.ok,.opts button.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.chips button.no,.opts button.no{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
button[disabled]{cursor:default}
.fb{font-size:13px;border-radius:8px;padding:9px 12px;background:var(--panel-2)}
.fb b.ok{color:var(--ok)} .fb b.no{color:var(--bad)}
.lock{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:13.5px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lock b{color:var(--fg)}

@media (max-width:1000px){
  .cards,.picks{grid-template-columns:repeat(2,minmax(0,1fr))}

  .routine{grid-template-columns:repeat(2,minmax(0,1fr))}
  .order{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dom > button{grid-template-columns:minmax(0,1fr) 84px 20px}
  .dom > button .sq{grid-column:1/-1;grid-row:2}
  .dom-detail{grid-template-columns:minmax(0,1fr);padding-left:14px}
  .glist{columns:1}
}
@media (max-width:640px){
  .wrap{padding-block:20px 56px;gap:22px}

  .drawer{top:auto;left:0;width:100%;max-height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-left:env(safe-area-inset-left,0px)}
  .brand{margin-right:0}

  .gloss dl,.res{grid-template-columns:minmax(0,1fr)}

  .gi{grid-template-columns:minmax(0,1fr)}
  .gi .gd em{display:inline;margin-left:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  function emit(name){ (subs[name] || []).forEach(function(cb){ cb(snap(name)); }); }
  return { collection: function(name){
    data[name] = data[name] || {}; subs[name] = subs[name] || [];
    return {
      onSnapshot: function(cb){ subs[name].push(cb); setTimeout(function(){ cb(snap(name)); }, 0); return function(){}; },

  h += '<div class="sec"><div class="steps-h"><span class="n">1</span><h2>역량 흐름</h2></div><p class="howto"><b>읽는 법</b>모든 문항은 이 흐름의 한 단계 상황에서 출제됨. 모듈을 듣거나 문제를 풀 때 해당 단계를 먼저 확인.</p>' + flowMap(c, false) + '</div>';

  h += '<div class="sec"><div class="steps-h"><span class="n">2</span><h2>모듈 학습</h2></div>';
  h += '<p class="howto"><b>모듈 형식</b>' + (k === 'ao' ? '화면을 넘기며 읽는 자료, 연습, 퀴즈로 구성. 영상 강의 없음. "화면" 1개 = 읽기 페이지 1장.' : 'CCAO-F와 같은 화면형 자료. 섹션마다 확인 문제(Checkpoint), 끝에 종합 과제(Cumulative Task) 또는 연습. "화면" 1개 = 읽기 페이지 1장.') + '</p>';
  h += '<p class="howto"><b>학습 루틴</b>모듈마다 아래 4단계 반복.</p><div class="routine"><div><b>1. 단계 확인</b>역량 흐름에서 모듈이 다루는 단계와 앞뒤 단계 확인</div><div><b>2. 모듈 수강</b>40~60분 단위로 끊어서 수강</div><div><b>3. 정리</b>정답을 가르는 판단 기준 3개와 새 용어 정리</div><div><b>4. 문제 5개</b>단계를 먼저 고른 뒤 풀이</div></div>';
  h += '<div class="mods">';
  c.modules.forEach(function(md_, i){
    var done = !!m[i];
    h += '<div class="mod' + (done ? ' done' : '') + '"><input type="checkbox" id="m-' + k + '-' + i + '" data-act="mod" data-i="' + i + '"' + (done ? ' checked' : '') + ' aria-label="' + esc(md_.t) + ' 완료"><div><label class="mt" for="m-' + k + '-' + i + '">' + esc(md_.t) + '</label><div class="mm">' + (md_.st ? '<span class="dm stg">' + esc(stName(c, md_.st)) + '</span>' : '') + md_.dom.map(function(did){ var d = c.domains.filter(function(x){ return x.id === did; })[0]; return d ? '<span class="dm ' + d.lv + '">' + esc(d.n) + '</span>' : ''; }).join('') + '<a href="' + c.prep.url + '/' + md_.slug + '" target="_blank" rel="noopener" style="font-size:12.5px">모듈 열기 ↗</a></div>' + (md_.note ? '<div class="note">' + esc(md_.note) + '</div>' : '') + '<details><summary>학습 목표</summary><ul>' + md_.obj.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details>' + lesList(md_) + '</div><span class="min">' + md_.min + '분</span></div>';
  });
  h += '</div></div>';

  h += '<div class="sec"><div class="steps-h"><span class="n">3</span><h2>샘플 문제</h2></div><p class="howto"><b>푸는 순서</b>① 문제가 역량 흐름의 몇 단계 상황인지 고르기 → ② 답 고르기 → ③ 해설 확인. 문제는 실제 시험처럼 영어, 해설은 한국어. ' + esc(c.qsNote || '정식 연습 문제는 11/17 새 가이드 공개 후 추가 예정.') + '</p><div class="qs">';
  c.qs.forEach(function(q, qi){
    var st = (p.qs && p.qs[q.id]) || {}; var L = S.q[q.id] || st;
    h += '<div class="q"><span class="qn">Q' + (qi+1) + '</span><p class="stem">' + esc(q.stem) + '</p>';
    h += '<div class="ph">① 역량 흐름 단계</div><div class="chips">';
    var stOpts = ['1','2','3','4','5'].concat(c.loop ? ['loop'] : []).concat(['across']);
    stOpts.forEach(function(s){
      var cls = '';
      if (L.stage){ if (s === q.st) cls = 'ok'; else if (s === L.stage) cls = 'no'; }
      h += '<button type="button" data-act="qst" data-q="' + q.id + '" data-s="' + s + '" class="' + cls + '"' + (L.stage ? ' disabled' : '') + '>' + esc(stName(c, s)) + '</button>';
    });
    h += '</div>';
    if (L.stage){
      h += '<div class="fb">' + (L.stage === q.st ? '<b class="ok">단계 정답.</b> ' : '<b class="no">단계 오답.</b> 정답: ' + esc(stName(c, q.st)) + '. ') + esc(q.stWhy) + '</div>';
      h += '<div class="ph">② 답 선택</div><div class="opts">';
      q.opts.forEach(function(op, oi){
        var cls = ''; if (L.ans != null){ if (oi === q.ok) cls = 'ok'; else if (oi === L.ans) cls = 'no'; }
        h += '<button type="button" data-act="qans" data-q="' + q.id + '" data-o="' + oi + '" class="' + cls + '"' + (L.ans != null ? ' disabled' : '') + '><b>' + 'ABCD'[oi] + '</b><span>' + esc(op) + '</span></button>';
      });
      h += '</div>';
      if (L.ans != null){
        h += '<div class="fb">' + (L.ans === q.ok ? '<b class="ok">정답.</b> ' : '<b class="no">오답.</b> 정답 ' + 'ABCD'[q.ok] + '. ') + esc(q.why) + '<br>' + q.no.map(function(n, ni){ return n ? '<span class="muted">' + 'ABCD'[ni] + ': ' + esc(n) + '</span>' : ''; }).filter(Boolean).join('<br>') + '</div>';
        h += '<div><button class="btn" type="button" data-act="qreset" data-q="' + q.id + '">다시 풀기</button></div>';
      }
    }
    h += '</div>';
  });
  h += '</div></div>';

  h += '<div class="sec"><div class="steps-h"><span class="n">4</span><h2>모의고사</h2></div><div class="lock"><b>' + c.items + '문항 · 120분</b>' + (c.mockNote && c.site ? '<span>' + esc(c.mockNote) + '</span><a href="' + c.site + '" target="_blank" rel="noopener">' + esc(c.siteName) + ' 열기 ↗</a>' : '<span>연습 문제 완성 후 공개. 실제 시험처럼 한 문항씩 진행하고, 끝나면 출제 영역별 점수 표시.</span><span class="mono">공개 예정: ' + (k === 'dv' ? '12/1' : '12/28') + '</span>') + '</div></div>';
  return h + '</div>';
}

/* ---------- events ---------- */
document.querySelector('.nav').addEventListener('click', function(e){
  var b = e.target.closest('[data-nav]'); if (!b) return;
  S.view = b.dataset.nav; S.stage = null;
  try { history.replaceState(null, '', '#' + S.view); } catch(_){}
  render(); window.scrollTo(0, 0);
});
VIEW.addEventListener('click', function(e){
  var li = e.target.closest('[data-item-row]'); if (li){ openEditor(li.dataset.itemRow); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act;
  if (a === 'add'){ openEditor(null, true); return; }
  if (a === 'listby'){ S.listBy = b.dataset.v === 'type' ? 'type' : 'cert'; try { localStorage.setItem('certhub_listby', S.listBy); } catch(_){} render(); return; }
  if (a === 'reset'){ S.confirmReset = true; render(); return; }
  if (a === 'reset-cancel'){ S.confirmReset = false; render(); return; }
  if (a === 'reset-go'){ S.confirmReset = false; render(); resetToBaseline(); return; }
  if (a === 'gtab'){ S.gTab = b.dataset.t; S.stage = null; render(); return; }
  if (a === 'stage'){ S.stage = S.stage === b.dataset.st ? null : b.dataset.st; render(); return; }
  if (a === 'stage-clear'){ S.stage = null; render(); return; }
  if (a === 'dom'){ var key = S.gTab + b.dataset.d; S.openDom[key] = !S.openDom[key]; render(); return; }
  if (a === 'cert'){ S.cTab = b.dataset.c; render(); window.scrollTo(0, 0); return; }
  if (a === 'cert-back'){ S.cTab = null; render(); window.scrollTo(0, 0); return; }
  var ck = S.cTab;
  if (a === 'qst' || a === 'qans' || a === 'qreset'){
    var qid = b.dataset.q; var p = S.progress[ck] = S.progress[ck] || {}; p.qs = p.qs || {};
    var cur = Object.assign({}, S.q[qid] || p.qs[qid] || {});
    if (a === 'qst'){ cur.stage = b.dataset.s; }
    if (a === 'qans'){
      cur.ans = +b.dataset.o; cur.done = true;
      var q = CERTS[ck].qs.filter(function(x){ return x.id === qid; })[0];
      cur.stageOk = cur.stage === q.st; cur.ansOk = cur.ans === q.ok;
      p.qs[qid] = cur; saveProgress(ck);
    }
    if (a === 'qreset'){ cur = {}; }
    S.q[qid] = cur; render(); return;
  }
});
VIEW.addEventListener('change', function(e){
  var t = e.target; if (!t.dataset || t.dataset.act !== 'mod') return;
  var ck = S.cTab; var p = S.progress[ck] = S.progress[ck] || {}; p.mods = p.mods || {};
  p.mods[t.dataset.i] = t.checked; saveProgress(ck); render();
});

render();
initDb();
})();
</script>

</body>
</html>
