<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Cert Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 한 페이지 구성: 응시 일정(응시일 설정) → 시험별 학습 자료(무엇·용도·시점·링크). 장식 요소는 시험별 색 하나만 사용. */
:root{
  --bg:#121116; --panel:#1b1a20; --panel-2:#23222a; --line:#302e38;
  --fg:#ecebef; --muted:#a3a0ac; --faint:#76737f;
  --accent:#e0805f; --accent-soft:rgba(224,128,95,.12); --accent-ink:#f0a184; --on-accent:#1a1210;
  --now:#5cb87f; --now-ink:#7fd09d; --now-soft:rgba(92,184,127,.12); --later:#e0805f; --later-ink:#f0a184; --later-soft:rgba(224,128,95,.12);
  --c-ao:#5fbfa9; --c-dv:#86a2f2; --c-arp:#e3ad62;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f1; --panel:#ffffff; --panel-2:#efede8; --line:#dfdcd5;
    --fg:#1c1a1f; --muted:#5d5a64; --faint:#86838c;
    --accent:#bf5835; --accent-soft:rgba(191,88,53,.08); --accent-ink:#a2442a; --on-accent:#ffffff; --now:#2f8a55; --now-ink:#236b41; --now-soft:rgba(47,138,85,.08); --later:#bf5835; --later-ink:#a2442a; --later-soft:rgba(191,88,53,.07);
    --c-ao:#24806e; --c-dv:#4565c9; --c-arp:#a8691a;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f4f1; --panel:#ffffff; --panel-2:#efede8; --line:#dfdcd5;
  --fg:#1c1a1f; --muted:#5d5a64; --faint:#86838c;
  --accent:#bf5835; --accent-soft:rgba(191,88,53,.08); --accent-ink:#a2442a; --on-accent:#ffffff; --now:#2f8a55; --now-ink:#236b41; --now-soft:rgba(47,138,85,.08); --later:#bf5835; --later-ink:#a2442a; --later-soft:rgba(191,88,53,.07);
  --c-ao:#24806e; --c-dv:#4565c9; --c-arp:#a8691a;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-underline-offset:3px}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand b{font-size:17px;font-weight:700}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.nav button{position:relative;border:0;background:transparent;border-radius:7px;padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.3;color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.nav button b{font-size:13.5px;font-weight:600}
.nav button span{font-size:11px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);cursor:default}
.nav button[aria-current="page"] span{color:var(--on-accent);opacity:.85}
.nav button[aria-disabled="true"]{cursor:not-allowed}
.nav button[aria-disabled="true"] b,.nav button[aria-disabled="true"] span{opacity:.4}
.nav button[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
.nav button[data-tip]:hover::after,.nav button[data-tip]:focus-visible::after,.nav button[data-tip].tip::after{opacity:1}
main .wrap{padding-block:28px 56px;display:flex;flex-direction:column;gap:36px}
h1{font-size:clamp(22px,3.4vw,28px);line-height:1.3;margin:0 0 6px}
h2{font-size:18px;margin:0 0 4px}
p{margin:0}
.lead{color:var(--muted);font-size:14.5px;max-width:64ch}
.howto{font-size:12.5px;color:var(--muted)}
.howto b{color:var(--fg);font-weight:600;margin-right:6px}
.sec{display:flex;flex-direction:column;gap:12px}
.notice{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px}
.notice b{margin-right:6px}

/* timeline */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 10px}
.tl-track{position:relative;height:128px}
.tl-m{position:absolute;bottom:0;font-family:var(--mono);font-size:11px;color:var(--faint);transform:translateX(-50%);white-space:nowrap}
.tl-axis{position:absolute;left:0;right:0;bottom:20px;border-top:1px solid var(--line)}
.tl-tick{position:absolute;bottom:16px;height:8px;border-left:1px solid var(--line)}
.tl-mk{position:absolute;top:18px;bottom:20px;border-left:1.5px dashed var(--faint)}
.tl-mk span{position:absolute;bottom:2px;left:4px;font-size:10.5px;color:var(--faint);white-space:nowrap}
.tl-mk.l span{left:auto;right:4px}
.tl-mk.t{border-left-color:var(--accent)}
.tl-mk.t span{color:var(--accent-ink);font-weight:600}
.ex .warn{color:var(--accent-ink);font-weight:600}
.tl-today{position:absolute;top:18px;bottom:20px;border-left:2px solid var(--fg)}
.tl-today span{position:absolute;top:-18px;left:0;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--fg);white-space:nowrap}
.tl-ex{position:absolute;display:flex;align-items:center;gap:6px;transform:translateX(-7px);white-space:nowrap;font-size:12px;font-weight:600;color:var(--cc);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:2px 0;border-radius:4px}
.tl-ex:hover i,.tl-ex:focus-visible i,.tl-ex.drag i{box-shadow:0 0 0 4px color-mix(in srgb, var(--cc) 30%, transparent)}
.tl-ex.drag{cursor:grabbing;z-index:5}
.tl-ex i{width:14px;height:14px;border-radius:50%;background:var(--cc);flex:none;border:2px solid var(--panel)}
.tl-ex.r{transform:translateX(calc(-100% + 7px));flex-direction:row-reverse}

/* exam cards */
.exams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ex{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:0 0 10px 10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ex-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-hd b{font-size:16px;color:var(--cc)}
.ex-hd .dd{font-family:var(--mono);font-size:15px;font-weight:600}
.ex .nm{font-size:12.5px;color:var(--muted);margin-top:-6px}
.ex label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ex input[type=date]{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:14px;width:100%}
.ex ul{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ex .reg{font-size:13px;font-weight:500;margin-top:2px}

/* materials */
.mat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cc);border-radius:0 10px 10px 0}
.mat-hd{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.mat-hd b{font-size:15px;color:var(--cc)}
.mat-hd span{font-size:12.5px;color:var(--muted)}
.mat ol{list-style:none;margin:0;padding:0}
.mi{display:grid;grid-template-columns:22px minmax(0,1fr) 128px;gap:4px 12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:start}
.mat li:last-child .mi{border-bottom:0}
.mi input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--cc)}
.mi .t{font-weight:600;font-size:14px}
.mi .t em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--faint);margin-left:6px}
.mi .d{font-size:13px;color:var(--muted);margin-top:2px}
.mi .w{font-size:12.5px;color:var(--muted);text-align:right;padding-top:1px}
.mi .w.now{color:var(--fg);font-weight:600}
.mi.done .t,.mi.done .d{opacity:.5}
.mi.done .t a{text-decoration-color:var(--faint)}
.mi.has{cursor:pointer}
.mi.has:hover{background:var(--panel-2)}
.mi .w.now{color:var(--now-ink)}
.mi .w.later{color:var(--later-ink)}
.cur-tg{margin-top:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:2px 10px;font:inherit;font-size:12px;color:var(--fg);cursor:pointer}
.cur-tg:hover{border-color:var(--muted)}
.cur-tg .n{color:var(--now-ink);font-weight:600}
.cur-tg .l{color:var(--later-ink);font-weight:600}
.cur{grid-column:2 / -1;border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}
.cur-sec{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin:12px 0 6px}
.cur-sec b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:600}
.cur-sec span{font-size:12px;color:var(--muted)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:7px 10px;border-left:3px solid var(--st);background:var(--panel-2);border-radius:0 6px 6px 0;margin-bottom:4px;align-items:start}
.ci.now{--st:var(--now)} .ci.later{--st:var(--later)}
.ci .ct{font-size:13px;font-weight:600}
.ci .ct a{color:var(--fg);text-decoration-color:var(--faint)}
.ci .cm{font-size:12px;color:var(--faint);font-weight:500;margin-left:6px}
.ci .cd{font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--st);color:var(--st-ink)}
.chip.now{--st:var(--now);--st-ink:var(--now-ink);background:var(--now-soft)}
.chip.later{--st:var(--later);--st-ink:var(--later-ink);background:var(--later-soft)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}

footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font-size:12px;color:var(--faint)}
footer a{color:var(--muted)}

@media (max-width:760px){
  .nav{width:100%}
  .nav button{flex:1;padding:6px 8px;min-width:0}
  .nav button b{font-size:12.5px}
  .exams{grid-template-columns:minmax(0,1fr)}
  .mi{grid-template-columns:22px minmax(0,1fr)}
  .mi .w{grid-column:2;text-align:left;padding-top:0}
  .cur{grid-column:1 / -1}
  .ci{grid-template-columns:minmax(0,1fr)}
  .ci .chip{justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

}

    }).join('');
  }).join('') + '</div>';
}
function teachLine(k, d){
  if (!PRIVATE || !TEACH_NEED[k]) return '';
  if (pd(d) >= pd(TEACH_DAY)) return '<li class="warn">1/9 강의 시작 이후 응시. 강의 전 합격 필요</li>';
  if (pd(addD(d, 14)) >= pd(TEACH_DAY)) return '<li class="warn">재응시 가능일이 1/9 강의 시작 이후</li>';
  return '<li>1/9 강의 전 합격 필요 · 재응시 여유 있음</li>';
}
function render(){
  if (DRAG) return;
  var list = sorted();
  var h = '<div class="sec"><div><h1>시험 일정과 학습 자료</h1><p class="lead">시험별 응시일을 정하고, 시점에 맞는 공식 강좌와 학습 자료를 한곳에서 확인하는 페이지.</p></div>';
  h += '<div class="notice"><b>12/7 시험 개편</b>CCAO-F, CCDV-F, CCAR-P는 12/7부터 새 내용으로 출제됨. 12/7 이후 응시하면 11/17 공개되는 새 시험 가이드로 준비해야 함 (Anthropic 공식 안내).</div></div>';

  h += '<div class="sec"><div><h2>응시 일정</h2><p class="howto"><b>사용법</b>타임라인의 점을 끌거나 카드의 날짜를 바꾸면 D-day, 재응시 가능일, 아래 자료 순서가 함께 바뀜.' + (S.local ? ' 설정은 이 브라우저에만 저장됨.' : '') + '</p></div>';
  h += timeline(list);
  h += '<div class="exams">' + list.map(function(e){
    var d = examDate(e.k), after = pd(d) >= pd(REVAMP_DAY);
    return '<div class="ex" style="--cc:var(' + e.cc + ')"><div class="ex-hd"><b>' + e.code + '</b><span class="dd">' + dday(d) + '</span></div><div class="nm">' + e.name + '</div>' +
      '<label>응시일<input type="date" data-exam="' + e.k + '" value="' + d + '" min="2026-10-15" max="2027-12-31"></label>' +
      '<ul><li>' + md(d) + '(' + wd(d) + ') 응시 · ' + (after ? '새 가이드 기준' : '현행 가이드(2026년 7월판) 기준') + '</li><li>탈락 시 ' + md(addD(d, 14)) + '부터 재응시 가능</li>' + teachLine(e.k, d) + '<li>' + e.facts + ' (개편 전 기준)</li></ul>' +
      '<a class="reg" href="' + e.reg + '" target="_blank" rel="noopener">시험 등록 페이지 ↗</a></div>';
  }).join('') + '</div></div>';

  h += '<div class="sec"><div><h2>시험별 학습 자료</h2><p class="howto"><b>읽는 법</b>위에서 아래로 보는 순서. 시점 = 보기 시작하기 좋은 때. 학습 경로와 Prep Course 항목을 누르면 전체 커리큘럼이 펼쳐짐. 체크 = 학습 완료 표시.</p>' + '<div class="legend2"><span class="chip now">지금 가능</span>시험 가이드 개편과 관계없는 일반 강좌<span class="chip later">11/17 이후</span>새 가이드 공개 후 들을 강좌 (Prep Course 모듈)</div></div>';
  list.forEach(function(e){
    var d = examDate(e.k);
    h += '<div class="mat" style="--cc:var(' + e.cc + ')"><div class="mat-hd"><b>' + e.code + '</b><span>' + md(d) + ' 응시 · ' + dday(d) + '</span></div><ol>';
    MATS[e.k].forEach(function(m){
      var done = isDone(e.k, m.id), cid = 'c-' + e.k + '-' + m.id, key = e.k + ':' + m.id, has = !!CUR[key], open = has && !!OPEN[key];
      var title = m.u ? '<a href="' + m.u + '" target="_blank" rel="noopener">' + esc(m.t) + ' ↗</a>' : esc(m.t);
      var wc = /지금 가능/.test(m.w) ? ' now' : (/11\/17 이후/.test(m.w) ? ' later' : '');
      var tg = '';
      if (has){ var cc = curCount(key); tg = '<button type="button" class="cur-tg" data-cur="' + key + '" aria-expanded="' + open + '">전체 커리큘럼 ' + cc.n + '개' + (cc.now ? ' · <span class="n">지금 ' + cc.now + '</span>' : '') + (cc.later ? ' · <span class="l">11/17 이후 ' + cc.later + '</span>' : '') + (open ? ' ▴' : ' ▾') + '</button>'; }
      h += '<li><div class="mi' + (done ? ' done' : '') + (has ? ' has' : '') + '"' + (has ? ' data-row="' + key + '"' : '') + '><input type="checkbox" id="' + cid + '" data-ck="' + e.k + '" data-id="' + m.id + '"' + (done ? ' checked' : '') + ' aria-label="' + esc(m.t) + ' 완료"><div><div class="t">' + title + (m.m ? '<em>' + esc(m.m) + '</em>' : '') + '</div><div class="d">' + esc(m.d) + '</div>' + tg + '</div><div class="w' + wc + '">' + esc(m.w) + '</div>' + (open ? curHTML(key) : '') + '</div></li>';
    });
    h += '</ol></div>';
  });
  h += '</div>';
  VIEW.innerHTML = h;
}

VIEW.addEventListener('change', function(e){
  var t = e.target;
  if (t.dataset.exam){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.value)) return;
    S.ex[t.dataset.exam] = { date:t.value }; persist('exams', t.dataset.exam, S.ex[t.dataset.exam]); render();
    var again = VIEW.querySelector('[data-exam="' + t.dataset.exam + '"]'); if (again) again.focus();
    return;
  }
  if (t.dataset.ck){
    var k = t.dataset.ck, c = S.ck[k] = S.ck[k] || { done:{} }; c.done = c.done || {};
    if (t.checked) c.done[t.dataset.id] = true; else delete c.done[t.dataset.id];
    persist('checks', k, c); render();
  }
});

/* 타임라인 점 끌기: 놓는 순간 저장 */
var DRAG = null;
function dateAt(clientX, rect){
  var f = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
  return fd(pd(R0) + Math.round(f * (pd(R1) - pd(R0)) / DAY) * DAY);
}
function setExamDate(k, d){ S.ex[k] = { date:d }; persist('exams', k, S.ex[k]); }
VIEW.addEventListener('pointerdown', function(e){
  var el = e.target.closest('.tl-ex'); if (!el || e.button > 0) return;
  var tr = document.getElementById('tlTrack'); if (!tr) return;
  DRAG = { k:el.dataset.k, el:el, rect:tr.getBoundingClientRect(), date:examDate(el.dataset.k), moved:false };
  try { el.setPointerCapture(e.pointerId); } catch(_){}
  el.classList.add('drag'); e.preventDefault();
});
window.addEventListener('pointermove', function(e){
  var g = DRAG; if (!g) return;
  var d = dateAt(e.clientX, g.rect); if (d === g.date) return;
  g.date = d; g.moved = true;
  var x = pos(d); g.el.style.left = x + '%'; g.el.classList.toggle('r', x > 70);
  g.el.querySelector('span').textContent = BYK[g.k].code + ' ' + md(d) + '(' + wd(d) + ')';
  g.el.setAttribute('aria-valuetext', md(d) + '(' + wd(d) + ')');
});
function endDrag(){
  var g = DRAG; if (!g) return; DRAG = null;
  if (g.moved) setExamDate(g.k, g.date);
  render();
  if (g.moved){ var again = VIEW.querySelector('.tl-ex[data-k="' + g.k + '"]'); if (again) again.focus({ preventScroll:true }); }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
VIEW.addEventListener('keydown', function(e){
  var el = e.target.closest && e.target.closest('.tl-ex'); if (!el) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  var k = el.dataset.k, step = (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 7 : 1);
  var d = addD(examDate(k), step); if (pd(d) < pd(R0) || pd(d) > pd(R1)) return;
  setExamDate(k, d); render();
  var again = VIEW.querySelector('.tl-ex[data-k="' + k + '"]'); if (again) again.focus();
});

VIEW.addEventListener('click', function(e){
  if (e.target.closest('a,input,label')) return;
  var b = e.target.closest('[data-cur]') || e.target.closest('[data-row]'); if (!b || e.target.closest('.cur')) return;
  var key = b.dataset.cur || b.dataset.row; OPEN[key] = !OPEN[key]; render();
  var tgb = VIEW.querySelector('[data-cur="' + key + '"]'); if (tgb && b.dataset.cur) tgb.focus({ preventScroll:true });
});
document.querySelectorAll('.nav button[data-tip]').forEach(function(b){
  b.addEventListener('click', function(){ b.classList.add('tip'); clearTimeout(b._t); b._t = setTimeout(function(){ b.classList.remove('tip'); }, 1600); });
});
function init(){
  var u = null;
  try { u = window.claude && window.claude.use ? window.claude.use('db') : null; } catch(e){ u = null; }
  Promise.resolve(u).catch(function(){ return null; }).then(function(x){
    if (!x){ S.local = true; lsLoad(); render(); return; }
    db = x;
    db.collection('exams').onSnapshot(function(s){ S.ex = snapMap(s); render(); }, function(){});
    db.collection('checks').onSnapshot(function(s){ S.ck = snapMap(s); render(); }, function(){});
  });
}
render();
init();
})();
</script>
